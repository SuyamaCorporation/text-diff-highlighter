<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Side-by-Side Text Diff Highlighter</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-6xl mx-auto p-4">
  <h1 class="text-2xl font-bold text-gray-800 mb-1">Side-by-Side Text Diff Highlighter</h1>
  <p class="text-gray-500 text-sm mb-4">Paste original and modified text, then click Diff to see changes highlighted.</p>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
    <div>
      <label class="block text-sm font-semibold text-gray-600 mb-1">Original Text</label>
      <textarea id="original" class="w-full h-48 p-3 border border-gray-300 rounded-lg font-mono text-sm resize-y focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Paste original text here...">The quick brown fox jumps over the lazy dog.
Hello, World!
This is a test line.
Another line here.
The end of the document.</textarea>
    </div>
    <div>
      <label class="block text-sm font-semibold text-gray-600 mb-1">Modified Text</label>
      <textarea id="modified" class="w-full h-48 p-3 border border-gray-300 rounded-lg font-mono text-sm resize-y focus:outline-none focus:ring-2 focus:ring-blue-400" placeholder="Paste modified text here...">The quick brown fox jumps over the lazy cat.
Hello, World!
This is a modified test line.
A completely new line was added.
Another line here.
The end of the document.</textarea>
    </div>
  </div>

  <div class="flex items-center gap-4 mb-4">
    <button onclick="runDiff()" class="px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700 transition">Compare Diff</button>
    <button onclick="clearAll()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-300 transition">Clear</button>
    <div id="stats" class="flex gap-4 text-sm"></div>
  </div>

  <div id="diffOutput" class="hidden">
    <div class="flex items-center gap-3 mb-2 text-xs font-semibold text-gray-500 uppercase tracking-wide">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-green-200 inline-block"></span> Added</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-red-200 inline-block"></span> Removed</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-sm bg-yellow-200 inline-block"></span> Changed</span>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border border-gray-300 rounded-lg overflow-hidden font-mono text-sm">
      <div id="leftPanel" class="border-r border-gray-300"></div>
      <div id="rightPanel"></div>
    </div>
  </div>
</div>

<script>
function lcs(a, b) {
  const m = a.length, n = b.length;
  const dp = Array.from({length: m+1}, () => Array(n+1).fill(0));
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      dp[i][j] = a[i-1] === b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const result = [];
  let i = m, j = n;
  while (i > 0 && j > 0) {
    if (a[i-1] === b[j-1]) { result.unshift({type:'equal', val:a[i-1]}); i--; j--; }
    else if (dp[i-1][j] > dp[i][j-1]) { result.unshift({type:'removed', val:a[i-1]}); i--; }
    else { result.unshift({type:'added', val:b[j-1]}); j--; }
  }
  while (i > 0) { result.unshift({type:'removed', val:a[i-1]}); i--; }
  while (j > 0) { result.unshift({type:'added', val:b[j-1]}); j--; }
  return result;
}

function runDiff() {
  const orig = document.getElementById('original').value.split('\n');
  const mod = document.getElementById('modified').value.split('\n');
  const diff = lcs(orig, mod);

  // Pair up adjacent removed+added as "changed"
  const paired = [];
  for (let i = 0; i < diff.length; i++) {
    if (diff[i].type === 'removed' && i+1 < diff.length && diff[i+1].type === 'added') {
      paired.push({type:'changed', left:diff[i].val, right:diff[i+1].val});
      i++;
    } else {
      paired.push(diff[i]);
    }
  }

  let added = 0, removed = 0, changed = 0;
  let leftHTML = '', rightHTML = '';
  let lineL = 1, lineR = 1;

  paired.forEach(d => {
    if (d.type === 'equal') {
      leftHTML += lineRow(lineL++, escape(d.val), 'bg-white', '');
      rightHTML += lineRow(lineR++, escape(d.val), 'bg-white', '');
    } else if (d.type === 'removed') {
      leftHTML += lineRow(lineL++, escape(d.val), 'bg-red-100', 'text-red-700');
      rightHTML += lineRow('', '', 'bg-red-50', '');
      removed++;
    } else if (d.type === 'added') {
      leftHTML += lineRow('', '', 'bg-green-50', '');
      rightHTML += lineRow(lineR++, escape(d.val), 'bg-green-100', 'text-green-700');
      added++;
    } else if (d.type === 'changed') {
      leftHTML += lineRow(lineL++, escape(d.left), 'bg-yellow-100', 'text-yellow-800');
      rightHTML += lineRow(lineR++, escape(d.right), 'bg-yellow-100', 'text-yellow-800');
      changed++;
    }
  });

  document.getElementById('leftPanel').innerHTML = leftHTML;
  document.getElementById('rightPanel').innerHTML = rightHTML;
  document.getElementById('diffOutput').classList.remove('hidden');

  const stats = document.getElementById('stats');
  stats.innerHTML = `
    <span class="text-green-600 font-semibold">+${added} added</span>
    <span class="text-red-600 font-semibold">−${removed} removed</span>
    <span class="text-yellow-600 font-semibold">~${changed} changed</span>
  `;
}

function lineRow(num, content, bg, textColor) {
  return `<div class="flex ${bg} border-b border-gray-200">
    <span class="w-10 flex-shrink-0 text-right pr-2 py-1 text-gray-400 text-xs select-none border-r border-gray-200">${num}</span>
    <span class="px-2 py-1 flex-1 whitespace-pre-wrap break-all ${textColor}">${content}</span>
  </div>`;
}

function escape(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function clearAll() {
  document.getElementById('original').value = '';
  document.getElementById('modified').value = '';
  document.getElementById('diffOutput').classList.add('hidden');
  document.getElementById('stats').innerHTML = '';
}
</script>
</body>
</html>
